name: Aggiorna cinema Italia
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: cinema-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Recupera film TMDB
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
        run: python scripts/fetch_movies.py
      - name: Verifica feed
        run: |
          python - <<'PY'
          import json
          d=json.load(open("public/cinema-it.json",encoding="utf-8"))
          print("generatedAt:",d["generatedAt"])
          print("window:",d["windowStart"],"->",d["windowEnd"])
          print("count:",d["count"])
          print("trailers:",sum(bool(m.get("youtubeKey")) for m in d["movies"]))
          assert all(d["windowStart"]<=m["releaseDate"]<=d["windowEnd"] for m in d["movies"])
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
